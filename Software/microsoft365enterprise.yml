Name: microsoft365enterprise
Description: Microsoft 365 Apps for enterprise.
Grade: Silver
Arch: win64
Channel: unstable
Runners:
- soda-11.0-11-experimental
- soda-11.0-12-experimental
- soda-11.0-13-experimental
- soda-11.0-14-experimental
- soda-11.0-16-experimental
- soda-11.0-17-experimental
- soda-11.0-18-experimental
- soda-11.0-19-experimental
- soda-11.0-20-experimental
- soda-11.0-21-experimental
- soda-11.0-22-experimental
- soda-11.0-23-experimental
- soda-11.0-24-experimental
- soda-11.0-25-experimental
- soda-11.0-26-experimental
- soda-11.0-27-experimental

Dependencies:
- andale32
- arial32
- arialb32
- comic32
- courie32
- georgi32
- impact32
- times32
- trebuc32
- verdan32
- webdin32
- gdiplus
- msls31
- msxml6
- office-runtime
- riched20
- selawik

Parameters:
  dxvk: true
  vkd3d: false
  gamescope: false
  renderer: gl
  wayland: true

Executables:
- name: Microsoft Word
  file: WINWORD.EXE
  path: Program Files/Microsoft Office/root/Office16/WINWORD.EXE
  pre_script: '%BOTTLE_PATH%/drive_c/microsoft365-pre-launch.sh'
- name: Microsoft Excel
  file: EXCEL.EXE
  path: Program Files/Microsoft Office/root/Office16/EXCEL.EXE
  pre_script: '%BOTTLE_PATH%/drive_c/microsoft365-pre-launch.sh'
- name: Microsoft PowerPoint
  file: POWERPNT.EXE
  path: Program Files/Microsoft Office/root/Office16/POWERPNT.EXE
  pre_script: '%BOTTLE_PATH%/drive_c/microsoft365-pre-launch.sh'
- name: Microsoft Outlook
  file: OUTLOOK.EXE
  path: Program Files/Microsoft Office/root/Office16/OUTLOOK.EXE
  pre_script: '%BOTTLE_PATH%/drive_c/microsoft365-pre-launch.sh'
- name: Microsoft OneNote
  file: ONENOTE.EXE
  path: Program Files/Microsoft Office/root/Office16/ONENOTE.EXE
  pre_script: '%BOTTLE_PATH%/drive_c/microsoft365-pre-launch.sh'
- name: Microsoft Access
  file: MSACCESS.EXE
  path: Program Files/Microsoft Office/root/Office16/MSACCESS.EXE
  pre_script: '%BOTTLE_PATH%/drive_c/microsoft365-pre-launch.sh'
- name: Microsoft Publisher
  file: MSPUB.EXE
  path: Program Files/Microsoft Office/root/Office16/MSPUB.EXE
  pre_script: '%BOTTLE_PATH%/drive_c/microsoft365-pre-launch.sh'

Steps:
- action: run_script
  script: |
    cat > !bottle_drive/microsoft365enterprise.xml <<EOF
    <Configuration>
      <Add OfficeClientEdition="64" Channel="Current">
        <Product ID="O365ProPlusRetail">
          <Language ID="MatchOS" Fallback="en-us" />
        </Product>
      </Add>
      <Display Level="None" AcceptEULA="TRUE" />
      <Updates Enabled="FALSE" />
    </Configuration>
    EOF

- action: run_winecommand
  commands:
  - command: sc
    arguments: create ClickToRunSvc binPath= '"C:\Program Files\Common Files\Microsoft Shared\ClickToRun\OfficeClickToRun.exe" /service' DisplayName= 'Microsoft Office Click-to-Run Service' start= auto type= own error= normal
    wait: true
    minimal: true
    success_codes: [0, 49]

- action: run_winecommand
  commands:
  - command: C:/windows/temp/office-deployment-tool/setup.exe
    label: Microsoft 365 setup
    arguments: /configure C:/microsoft365enterprise.xml
    wait: true
    minimal: true
    skip_if_files_exist:
    - Program Files/Microsoft Office/root/Office16/WINWORD.EXE
    - Program Files/Microsoft Office/root/Office16/EXCEL.EXE
    - Program Files/Microsoft Office/root/Office16/POWERPNT.EXE
    - Program Files/Microsoft Office/root/Office16/OUTLOOK.EXE
    - Program Files/Microsoft Office/root/Office16/ONENOTE.EXE
    - Program Files/Microsoft Office/root/Office16/MSACCESS.EXE
    - Program Files/Microsoft Office/root/Office16/MSPUB.EXE
    progress:
      path: users/*/AppData/Local/Temp/CPAK-*.log
      encoding: utf-16-le
      pattern: 'ScenarioController::UpdateScenarioProgress - total progress is now ([0-9]+)'

- action: run_script
  script: |
    install -m 0644 "!bottle_drive/Program Files/Common Files/Microsoft Shared/ClickToRun/AppvIsvSubsystems64.dll" "!bottle_drive/Program Files/Microsoft Office/root/Office16/AppvIsvSubsystems64.dll"
    install -m 0644 "!bottle_drive/Program Files/Common Files/Microsoft Shared/ClickToRun/C2R64.dll" "!bottle_drive/Program Files/Microsoft Office/root/Office16/C2R64.dll"
    printf "%s\n" "#!/bin/sh" "locker=\"\$(dirname \"\$0\")/ProgramData/Microsoft/Office/ClickToRunPackageLocker\"" "test ! -e \"\$locker\" || chmod 0770 \"\$locker\"" > "!bottle_drive/microsoft365-pre-launch.sh"
    chmod 0755 "!bottle_drive/microsoft365-pre-launch.sh"
    test ! -e "!bottle_drive/ProgramData/Microsoft/Office/ClickToRunPackageLocker" || chmod 0770 "!bottle_drive/ProgramData/Microsoft/Office/ClickToRunPackageLocker"

- action: run_winecommand
  commands:
  - command: reg
    arguments: add "HKCU\Software\Wine\DllOverrides" /v sppc /t REG_SZ /d builtin,native /f
    wait: true
    minimal: true
  - command: reg
    arguments: add "HKCU\Software\Microsoft\Office\16.0\Common\Licensing\LicensingNext" /v O365ProPlusRetail /t REG_DWORD /d 2 /f
    wait: true
    minimal: true
  - command: reg
    arguments: delete "HKCU\Software\Wine\Direct2D" /v max_version_factory /f
    wait: true
    minimal: true
    success_codes: [0, 1]
  - command: reg
    arguments: add "HKCU\Software\Wine\Direct3D" /v MaxVersionGL /t REG_DWORD /d 0x30002 /f
    wait: true
    minimal: true
Checks:
  files:
  - Program Files/Microsoft Office/root/Office16/WINWORD.EXE
